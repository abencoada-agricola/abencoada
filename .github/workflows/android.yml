name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'scripts/build-mobile.mjs'
      - 'scripts/app-version.mjs'
      - 'app-version.json'
      - 'web/backend.js'
      - 'web/gmais-fleet.js'
      - 'web/fuel-utils.js'
      - 'web/text-case.js'
      - 'web/navigation-icons.js'
      - 'web/logo.png'
      - 'web/fleets.json'
      - 'package*.json'
      - '.github/workflows/android.yml'
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - name: Select app version without digits 1 or 3
        run: node scripts/app-version.mjs "$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - run: npm run build:mobile
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_LOGIN_KEY: ${{ vars.SUPABASE_LOGIN_KEY }}
      - run: npx cap sync android
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/abencoada.p12"
          chmod 600 "$RUNNER_TEMP/abencoada.p12"
      - name: Build signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/abencoada.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease -PappVersionCode="$APP_VERSION_CODE" -PappVersionName="$APP_VERSION"
      - name: Verify signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
      - name: Prepare download
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk abencoada.apk
          sha256sum abencoada.apk > abencoada.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: abencoada-apk
          path: |
            abencoada.apk
            abencoada.apk.sha256
      - name: Publish APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Installable Android app with account login, fleet QR scanning, previous readings and offline refueling records. Requires Android 8 or later.

          NOTES
          gh release create "android-${APP_VERSION}" abencoada.apk abencoada.apk.sha256 --target "$GITHUB_SHA" --title "Abençoada · Android ${APP_VERSION}" --notes-file "$RUNNER_TEMP/release-notes.md"
