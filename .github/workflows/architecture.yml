name: Project architecture map
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'web/**'
      - 'android/**'
      - 'supabase/**'
      - 'tests/**'
      - 'scripts/**'
      - 'tools/graphify-requirements.txt'
      - '.graphifyignore'
      - '.github/workflows/architecture.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: project-architecture
  cancel-in-progress: true
jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r tools/graphify-requirements.txt
      - run: node scripts/project-graph.mjs rebuild
        env:
          GRAPHIFY_BIN: graphify
      - uses: actions/upload-artifact@v4
        with:
          name: project-architecture
          retention-days: 14
          if-no-files-found: error
          path: |
            graphify-out/graph.json
            graphify-out/graph.html
            graphify-out/GRAPH_REPORT.md
            graphify-out/BUILD.json
            graphify-out/HEALTH.txt
